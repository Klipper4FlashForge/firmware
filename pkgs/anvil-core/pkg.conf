# anvil-core -- this repo's own files: the init scripts, the two shell
# libraries everything sources, the helper programs and the configuration.
#
# THE ONLY RECIPE WHOSE SOURCE IS ENTIRELY THIS CHECKOUT, which is why it says
# so with pkg_intree and why the cache key needs the extra field below.
#
# ARCHITECTURE all. Shell, Python source, JSON and Klipper .cfg -- not one
# byte of native code, so there is no architecture to claim and no reason for
# a printer to reject it.
PKG_NAME=anvil-core
PKG_ARCH=all

# THE VERSION IS THE RELEASE'S. MOD_VER is what bin/pack.sh stamps on the
# tarball, and it is pinnable (MOD_VER=20260824) precisely so an old release
# can be rebuilt. It is monotone, so apk orders upgrades correctly.
PKG_VERSION="$MOD_VER"
PKG_RELEASE=1
PKG_EXCLUDE=".version"

# No Depends, deliberately. The init scripts call s6 and start Moonraker, so
# naming anvil-s6 and anvil-moonraker here looks right -- and would be wrong:
# each is a separate package that a build can leave out (BUILD_MOONRAKER) or a
# printer can `apk del`, and the scripts that would have started it must
# still install and still say, in the boot log, that it is not there.
PKG_DEPENDS=""
PKG_BUILD_DEPENDS=""

# Local recipe files are covered by pkg_stamp. These inputs live outside the
# recipe: the public signing key and the URL used for etc/apk/repositories.
PKG_STAMP_EXTRA="$(pkg_signkey_hash) $FEED_URL/$IPK_ARCH"

PKG_DESCRIPTION="The mod's own scripts and configuration: init.d services, the shared environment and service libraries, the wifi and startup helpers, and the nginx and Moonraker config."
