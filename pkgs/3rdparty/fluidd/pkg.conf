PKG_NAME=anvil-fluidd
PKG_ARCH=all
PKG_VERSION="${FLUIDD_VERSION#v}"
PKG_RELEASE=1

PKG_EXCLUDE=".version"
PKG_DEPENDS=""
PKG_BUILD_DEPENDS=""
PKG_WHEN='[ "${BUILD_FLUIDD:-1}" = "1" ]'

PKG_DESCRIPTION="Fluidd, the Klipper web interface. Static files served by the printer's own nginx from /usr/data/anvil/www/fluidd."
