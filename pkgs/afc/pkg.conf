# anvil-afc -- AFC-Klipper-Add-On, the filament layer over ff_toolchange.
#
# ff_toolchange still docks, grabs and offsets the four heads; AFC sits on top
# as a "Toolchanger" unit with one standalone lane per head and owns what a
# toolchanger alone has no notion of: which physical head a slicer's T<n>
# lands on (SET_MAP), which head takes over when one runs out (SET_RUNOUT),
# and which Spoolman spool each head is drawing from (SET_SPOOL_ID). It
# reaches the changer through SELECT_TOOL / UNSELECT_TOOL, the
# klipper-toolchanger names ff_toolchange already answers to.
#
# ARCHITECTURE all: Python extras and nothing else.
PKG_NAME=anvil-afc
PKG_ARCH=all

# A COMMIT, versioned like pkgs/timelapse: the commit date, then the short
# sha. Upstream's newest tag is older than the toolchanger unit this relies on.
# `~<sha>` rather than `+git<sha>`: apk's version grammar has no `+`.
PKG_VERSION="$(printf '%s' "$AFC_DATE" | tr -d -)~$(printf '%.8s' "$AFC_VERSION")"
PKG_RELEASE=1

PKG_EXCLUDE=".version"

# anvil-klipper because the extras land inside its klippy tree and import its
# modules (chelper, configfile, extras.force_move). Everything else AFC
# imports is the standard library -- it talks to Moonraker over plain urllib.
PKG_DEPENDS="anvil-klipper"
PKG_BUILD_DEPENDS=""

# NO PKG_WHEN: AFC is always on. printer.base.cfg includes ff-afc.cfg
# unconditionally, and a config section whose extra is missing stops klippy at
# config load -- an off switch here would give a printer that does not boot.
#
# No PKG_STAMP_EXTRA: no payload/ of our own, so AFC_VERSION describes every
# input this recipe has.

PKG_DESCRIPTION="AFC-Klipper-Add-On: tool mapping, infinite spool and per-tool Spoolman spools on top of the Creator 5 toolchanger. Drives the AFC panels in Mainsail and HelixScreen."
