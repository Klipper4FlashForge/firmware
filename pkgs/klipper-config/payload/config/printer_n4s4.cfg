#####################################################################
# Creator 5 N4S4 local configuration
#
# This file contains the N4S4 printer overrides and integration macros: the
# values for [ff_toolchange], [probe] and [bed_mesh], the shared filament
# stepper ([ff_extruder]), the statistics ([ff_stats]), the lag watch
# ([ff_lagwatch]) and the purge and cleaning macros. Six macros of the original are redefined here (ADAPTIVE_MESH,
# DEFINE_PRIME_TOWER_OBJECT, _FF_FILAMENT, _FF_NOZZLE_WIPE, _FF_NOZZLE_CLEAN,
# PURGE); qa/static/test_n4s4_overrides.py guards them. UPSTREAM_STATUS_N4S4.md
# says which part of this file is the original project's and which is N4S4's.
#
# It is intended to be included from printer.cfg before SAVE_CONFIG:
#
#   [include printer_n4s4.cfg]
#
#####################################################################

#####################################################################
# Shared filament stepper
#
# Creator 5 has four logical hotends but one physical filament stepper.
# This extra adapts unmodified Klipper extruder.py before toolhead creates the
# extruders, so [extruder1]..[extruder3] keep their heaters and motion queues
# without attempting to register the repeated physical stepper pins. See
# UPSTREAM_STATUS_N4S4.md, section 5, for why it is kept.
#####################################################################

[ff_extruder]
shared_extruder: extruder
post_m109_macro: _NS_TOOLCHANGE_PRIME

#####################################################################
# Nozzle diameters (Mainsail buttons)
#
# Stage one or more actual nozzle sizes, then apply them together with
# Klipper's SAVE_CONFIG (which creates a backup and restarts Klipper).
# SET does not change extrusion limits until APPLY has saved and restarted.
# Keep nozzle_diameter out of included files: SAVE_CONFIG stores it in
# printer.cfg's managed block. Also configure the same diameter in Orca.
#####################################################################

[ff_nozzle_size]

[gcode_macro NOZZLE_SIZE_STATUS]
description: Show active nozzle diameters and staged changes for T0 through T3
gcode:
    FF_NOZZLE_SIZE_STATUS

[gcode_macro NOZZLE_SIZE_SET]
description: Stage a nozzle diameter in mm (TOOL=0..3 DIAMETER=0.25); APPLY saves
gcode:
    {% set tool = params.TOOL|default('') %}
    {% set diameter = params.DIAMETER|default('') %}
    {% if tool == '' or diameter == '' %}
        {action_raise_error("Usage: NOZZLE_SIZE_SET TOOL=0..3 DIAMETER=0.25")}
    {% endif %}
    FF_NOZZLE_SIZE_SET TOOL={tool} DIAMETER={diameter}

[gcode_macro NOZZLE_SIZE_APPLY]
description: Save all staged nozzle sizes and restart Klipper (only when idle)
gcode:
    FF_NOZZLE_SIZE_APPLY

#####################################################################
# Tool-change travel and pressure handling
#
# Raise before crossing to the old tool's dock and keep Z raised throughout
# the exchange. Restore XY when T<n> was issued inside the registered prime
# tower. If Orca issued T<n> over the previously printed object, skip that
# restore so the new tool cannot lower and leave a dot on the object; Orca's
# following travel takes the raised/retracted tool to the prime tower.
# Values are mm, feeds are mm/min.
#####################################################################

[ff_toolchange]
grab_retreat_feed: 4800
restore_axis: xy
restore_feed: 30000
restore_z_hop: 2.0
restore_z_feed: 1200
restore_retract: 0.4
restore_retract_feed: 1800
# A pickup followed by a purge line or registered prime tower may remove
# more nozzle pressure. The ordinary 0.4 mm value above remains in force for
# every pickup whose following extrusion is not known.
purge_retract: 0.9
purge_retract_dwell_ms: 250
# Re-used tools were already retracted by Orca before they were parked. Do
# not add another pressure deficit on subsequent prime-tower pickups.
tower_repeat_retract: 0.0
restore_unretract: 0.4
restore_unretract_feed: 200
no_tower_prime_macro: _NS_MARK_TOOL_PRIME
# The pickups of the cleaning macros (_FF_NOZZLE_CLEAN, PURGE) restore no X/Y.
# They are protected all the same: the old tool is raised before it crosses to
# its dock and the new one retracts while it is still seated in its dock.
protect_every_change: 1
# The docks stand right of x_safe, one tool after the other. The return after a
# change is one straight move, so back to the purge chute (T1 picked up at the
# end of a LOAD_FILAMENT) it would cut across the docked T2 with T1 on the
# carriage. With this on, a return to a point beyond the safe column goes along
# the column first, then out, as every dock move does.
restore_via_corridor: 1
# Every wait in a change (after the approach to a dock, after the retreat) also
# sends the steps of the last stretch of the move to the MCU at once. Without
# it those steps leave the host from a timer 0.2 s before they are due, and a
# stall of Klipper's main thread at that moment shuts the MCU down ("Timer too
# close", 2026-10-14, T3's dock). No time is lost. See docs/host-stalls.md.
flush_steps_before_wait: 1


[gcode_macro TOOLCHANGE_STATUS]
description: Show toolchanger sensors, geometry, offsets and active tool
gcode:
    FF_TOOLCHANGE_STATUS


#####################################################################
# Statistics
#
# ff_stats.py keeps lifetime and per-job statistics in
# /usr/data/anvil-data/stats/ff_stats.json: tool changes (count, duration,
# failures), print time split into phases, and filament MEASURED per tool.
# It also makes print_stats.filament_used correct while a job prints, which
# fixes the filament figure of Mainsail's dashboard and job history.
#
# The macros below are buttons in Mainsail and print to its console. The same
# numbers are readable as printer.ff_stats.* (Moonraker API, other macros).
# See docs/statistics.md. The defaults are right for this printer; the
# options (path, max_jobs, phase_commands, correct_print_stats, ...) are
# described there.
#####################################################################

[ff_stats]

[gcode_macro FF_STATS]
description: Lifetime statistics: jobs, print time, filament per tool, tool changes, phases
gcode:
    FF_STATS_SHOW WHAT=SUMMARY

[gcode_macro FF_STATS_JOB]
description: Statistics of the running job, or of the last finished one
gcode:
    FF_STATS_SHOW WHAT=JOB

[gcode_macro FF_STATS_JOBS]
description: Recent jobs, newest last (COUNT=10)
gcode:
    FF_STATS_SHOW WHAT=JOBS{% if 'COUNT' in params %} COUNT={params.COUNT|int}{% endif %}


#####################################################################
# Lag watch
#
# ff_lagwatch.py notes in printer.log when Klipper's main thread is away for
# a quarter of a second or more, and in what: a write to the eMMC, a garbage
# collection, anything else. FF_LAGWATCH summarises. It changes nothing about
# a print. See docs/host-stalls.md.
#####################################################################

[ff_lagwatch]


#####################################################################
# just 1 sample to save time
#####################################################################

[probe]
samples: 1


#####################################################################
# faster bed mesh
#####################################################################

[bed_mesh]
speed: 300
horizontal_move_z: 3
move_check_distance: 3
mesh_min: 0, 0
mesh_max: 250, 250
# probe_count: 5, 5
probe_count: 8, 8
mesh_pps: 3, 3
algorithm: bicubic
bicubic_tension: 0.8
# fade_start: 0.5
# fade_end: 5.5
# #fade_target: 0

# The contact-probe travel optimisation ([ff_bed_mesh]: first point at Z 5,
# later points 2 mm above the last trigger, Z 3 below Z 1) is part of
# ff-print-macros.cfg now, with the same values this file used to set.


#####################################################################
# Shared 24V hotend power
#
# The heater board's 24 V rail (eheaterboard:PA3) is owned by
# [heater_fan dc24v_ctl] in printer.base.cfg: on while any hotend has a
# target or is above 50 C, off when idle and cold and on shutdown.
# Do not define a second object on this pin here.
#####################################################################


#####################################################################
# Shared physical extruder stepper
#
# Only [extruder] owns the physical stepper.
# extruder1..extruder3 remain logical hotends only.
#####################################################################

[extruder]
step_pin: eboard:PB14
dir_pin: eboard:PB15
enable_pin: !eboard:PB12
microsteps: 16
gear_ratio: 6.5:1
rotation_distance: 19.15
full_steps_per_rotation: 200

pressure_advance: 0.02
pressure_advance_smooth_time: 0.02


#####################################################################
# Per-build-plate first-layer Z corrections
#
# Positive values raise the nozzle (less squish); negative values lower it
# (more squish). Keep one reference plate at 0.000 and calibrate the others
# with the same reference filament. Orca passes one of the symbolic codes
# handled by ADAPTIVE_MESH below.
# defaults here are based on PLA filament - need per filament adjustments (esp. for eg. PETG)
#####################################################################

[gcode_macro _BUILD_PLATE_OFFSETS]
variable_smooth_cool: 0.000
variable_smooth_high_temp: 0.000
variable_textured_cool: 0.000
variable_textured_pei: 0.03
variable_engineering: 0.000
variable_supertack: 0.000
gcode:
    { action_respond_info("Edit this macro's variables to calibrate build-plate Z offsets") }


#####################################################################
# Persistent local settings
#
# Klipper creates/updates this file on the printer. It stores the timelapse
# switch so its state survives FIRMWARE_RESTART and a complete reboot.
#####################################################################

[save_variables]
filename: /usr/data/anvil-data/config/n4s4_saved_variables.cfg


#####################################################################
# Timelapse mode
#
# Visible in Mainsail. Clicking without parameters toggles frame capture;
# the console form can also set it explicitly:
#   TIMELAPSE_TOGGLE ENABLE=1
#   TIMELAPSE_TOGGLE ENABLE=0
# Orca can keep calling TIMELAPSE_TAKE_FRAME unconditionally. The existing
# timelapse macro ignores those calls while its enable variable is false.
#####################################################################

[gcode_macro TIMELAPSE_TOGGLE]
description: Toggle timelapse frame capture and save the setting
gcode:
    {% set timelapse = printer["gcode_macro TIMELAPSE_TAKE_FRAME"] %}
    {% if 'ENABLE' in params %}
        {% set next = params.ENABLE|int %}
        {% if next != 0 and next != 1 %}
            { action_raise_error("TIMELAPSE_TOGGLE: ENABLE must be 0 or 1") }
        {% endif %}
    {% else %}
        {% set next = 0 if timelapse.enable else 1 %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=enable VALUE={True if next else False}
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=disabled_notice VALUE=False
    SAVE_VARIABLE VARIABLE=timelapse_enabled VALUE={next}

    {% if next %}
        { action_respond_info("Timelapse ENABLED: Orca frame requests will be captured") }
    {% else %}
        { action_respond_info("Timelapse DISABLED: Orca frame requests will be ignored") }
    {% endif %}


#####################################################################
# Pre-print purge mode
#
# Visible in Mainsail. Clicking cycles FIRST -> ALL -> OFF. The console form
# selects a mode directly:
#   START_PURGE_SET MODE=OFF
#   START_PURGE_SET MODE=FIRST
#   START_PURGE_SET MODE=ALL
# The setting is persistent. FIRST preserves the previous behaviour; ALL
# purges every tool used by the G-code at the rear-right purge chute.
#####################################################################

[gcode_macro START_PURGE_SET]
description: Select persistent pre-print chute purge mode (OFF/FIRST/ALL)
variable_mode: 1
gcode:
    {% set requested = params.MODE|default('')|string|upper %}
    {% if requested == '' %}
        {% set next = (mode|int + 1) % 3 %}
    {% elif requested == 'OFF' or requested == '0' %}
        {% set next = 0 %}
    {% elif requested == 'FIRST' or requested == '1' %}
        {% set next = 1 %}
    {% elif requested == 'ALL' or requested == '2' %}
        {% set next = 2 %}
    {% else %}
        { action_raise_error("START_PURGE_SET: MODE must be OFF, FIRST or ALL") }
    {% endif %}

    SET_GCODE_VARIABLE MACRO=START_PURGE_SET VARIABLE=mode VALUE={next}
    SAVE_VARIABLE VARIABLE=start_purge_mode VALUE={next}

    {% set label = 'OFF' if next == 0 else ('FIRST' if next == 1 else 'ALL') %}
    { action_respond_info("Pre-print chute purge mode: %s" % label) }


[gcode_macro START_PURGE_STATUS]
description: Show the current pre-print chute purge mode
gcode:
    {% set mode = printer["gcode_macro START_PURGE_SET"].mode|int %}
    {% set label = 'OFF' if mode == 0 else ('FIRST' if mode == 1 else 'ALL') %}
    { action_respond_info("Pre-print chute purge mode: %s" % label) }


#####################################################################
# Fixed front-wipe temperature
#
# The stock implementation uses purge temperature minus clean_cool_delta,
# producing a different wipe temperature for every material. Use one absolute
# target instead; 150 C keeps the filament soft enough to avoid a brittle,
# overly cold wipe while still reducing ooze before the tool is docked.
#####################################################################

[gcode_macro _FF_FILAMENT]
variable_clean_wipe_temp: 150.0
# Absolute G-code height for parking the nozzle on the silicone cooling pad.
# This intentionally presses 0.9 mm below the calibrated Z0 plane, but avoids
# the previous raw-frame conversion which produced approximately Z-1.9.
variable_clean_wipe_z_absolute: -0.9
# Cycle deterministically through every 1 mm grid point in the collision-safe
# part of the pad. With the stock X266.5/Y13.8 origin these offsets stop at
# X267.5 and Y13.8, safely inside the measured X268/Y14 hard limits next to
# parked T0. The 6 x 5 combinations are all visited before repeating.
variable_cooldown_pad_x_offsets: [0.0, 1.0, -4.0, -3.0, -2.0, -1.0]
variable_cooldown_pad_y_offsets: [0.0, -4.0, -1.0, -2.0, -3.0]
variable_cooldown_pad_index: 0
variable_cooldown_pad_seed: -1
# Fast mechanical wipe across the short silicone lip in front of the cooling
# pad. Coordinates are absolute G-code coordinates in the active tool frame;
# Klipper already applies the selected tool's calibrated transform.
variable_lip_wipe_enabled: 1
variable_lip_wipe_x_left: 262.0
variable_lip_wipe_x_right: 273.0
variable_lip_wipe_y_start: 0.0
variable_lip_wipe_z: -1.0
variable_lip_wipe_feed: 9000


[gcode_macro _NS_CHUTE_LIP_WIPE]
description: Remove purge residue on the front-right silicone lip
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set tool = params.TOOL|int %}
    {% set enabled = params.ENABLE|default(ff.lip_wipe_enabled)|int %}
    {% set safe_z = [printer.gcode_move.gcode_position.z|float,
                     ff.purge_z|float]|max %}
    {% set wipe_z = ff.lip_wipe_z|float %}
    {% set exit_z = params.EXIT_Z|default(safe_z)|float %}
    {% set xl = ff.lip_wipe_x_left|float %}
    {% set xr = ff.lip_wipe_x_right|float %}
    {% set y0 = ff.lip_wipe_y_start|float %}

    G90
    # Stay raised and outside the right bed edge for the complete trip from
    # the rear chute. This also protects already printed first-layer areas.
    {% if printer.gcode_move.gcode_position.z|float < safe_z %}
        G1 Z{safe_z} F3000
    {% endif %}
    G1 X256 F{ff.travel_x_feed}
    G1 Y{y0} F{ff.travel_y_feed}

    {% if enabled %}
        G1 X{xr} F{ff.clean_wipe_feed}
        G1 Z{wipe_z} F{ff.clean_wipe_z_feed}
        G1 X{xl} Y{y0 + 0.5} F{ff.lip_wipe_feed}
        G1 X{xr} Y{y0 + 1.0} F{ff.lip_wipe_feed}
        G1 X{xl} Y{y0 + 1.5} F{ff.lip_wipe_feed}
        G1 X{xr} Y{y0 + 2.0} F{ff.lip_wipe_feed}
        G1 X{xl} Y{y0 + 2.5} F{ff.lip_wipe_feed}
        G1 X{xr} Y{y0 + 3.0} F{ff.lip_wipe_feed}
        G1 X{xl} Y{y0 + 3.5} F{ff.lip_wipe_feed}
        G1 X{xr} Y{y0 + 4.0} F{ff.lip_wipe_feed}
        G1 X{xl} Y{y0 + 4.5} F{ff.lip_wipe_feed}
        G1 X{xr} Y{y0 + 5.0} F{ff.lip_wipe_feed}
        G1 X{xl} Y{y0 + 5.5} F{ff.lip_wipe_feed}
        G1 X{xr} Y{y0 + 6.0} F{ff.lip_wipe_feed}
        G1 X{xl} Y{y0 + 6.5} F{ff.lip_wipe_feed}
        G1 X{xr} Y{y0 + 7.0} F{ff.lip_wipe_feed}
        G1 Z{exit_z} F{ff.clean_wipe_z_feed}
    {% endif %}
    M400


[gcode_macro _FF_NOZZLE_WIPE]
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set tool = params.TOOL|int %}
    {% set purge_temp = params.TEMP|float %}
    {% set extruder = printer["tool T%d" % tool].extruder %}
    {% set wipe_temp = [ff.clean_wipe_temp|float, purge_temp]|min %}
    {% set wipe_z = ff.clean_wipe_z_absolute|float %}
    {% set pad_x_offsets = ff.cooldown_pad_x_offsets %}
    {% set pad_y_offsets = ff.cooldown_pad_y_offsets %}
    {% set pad_x_count = pad_x_offsets|length %}
    {% set pad_y_count = pad_y_offsets|length %}
    {% set pad_count = pad_x_count * pad_y_count %}
    {% set cycle_index = ff.cooldown_pad_index|int %}
    {% set saved_seed = ff.cooldown_pad_seed|int %}
    {% if saved_seed < 0 %}
        {% set seed = (((printer.system_stats.cputime|float * 1000.0)|int)
                       + ((printer.print_stats.total_duration|float * 100.0)|int)
                       + tool * 17) % pad_count %}
    {% else %}
        {% set seed = saved_seed %}
    {% endif %}
    {% set pad_index = (seed + cycle_index) % pad_count %}
    {% set pad_x = (ff.clean_wipe_x|float)
                    + (pad_x_offsets[pad_index % pad_x_count]|float) %}
    {% set pad_y = (ff.clean_wipe_y|float)
                    + (pad_y_offsets[pad_index % pad_y_count]|float) %}
    {% set next_cycle_index = (cycle_index + 1) % pad_count %}

    G90
    # Only a 2 mm lift is needed for the short lip-to-pad move. Direct calls
    # without EXIT_Z retain the raised safe-Z exit used during a live print.
    _NS_CHUTE_LIP_WIPE TOOL={tool} EXIT_Z={ff.lip_wipe_z|float + 2.0}
    # Move from the locally raised lip to the collision-limited cooling-pad
    # grid and only then lower onto it.
    G1 X{pad_x} Y{pad_y} F{ff.clean_wipe_feed}
    G1 Z{wipe_z} F{ff.clean_wipe_z_feed}
    M400
    {% if saved_seed < 0 %}
        SET_GCODE_VARIABLE MACRO=_FF_FILAMENT VARIABLE=cooldown_pad_seed VALUE={seed}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_FF_FILAMENT VARIABLE=cooldown_pad_index VALUE={next_cycle_index}

    {% if wipe_temp > 0 and purge_temp > wipe_temp %}
        M104 S{wipe_temp} T{tool}
        TEMPERATURE_WAIT SENSOR={extruder} MAXIMUM={wipe_temp + 3}
    {% endif %}

    M106 P1 S0
    G1 Z10 F1200
    M400


#####################################################################
# Safe sequential chute purge
#
# Override the stock _FF_NOZZLE_CLEAN body while keeping its helpers and
# tunables. Global restore_axis=xy is correct for slicer tool changes, but it
# is unsafe between consecutive cleaning passes: after docking one tool it
# returns the empty carriage to the front wipe position, and after grabbing
# the next one it crosses the occupied dock area diagonally. Explicitly empty
# RESTORE_AXIS keeps each pickup/release at the toolchanger's safe X position.
#####################################################################

[gcode_macro _FF_NOZZLE_CLEAN]
variable_park_retract: 0.4
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set fallback = params.TEMP|default(ff.default_temp)|float %}
    {% set tools = [] %}
    {% for value in (params.TOOLS|default('')|string).split(',') %}
        {% if value|trim != '' and value|trim|int not in tools %}
            {% set _ = tools.append(value|trim|int) %}
        {% endif %}
    {% endfor %}
    {% set temps = [] %}
    {% for value in (params.TEMPS|default('')|string).split(',') %}
        {% if value|trim != '' %}
            {% set _ = temps.append(value|trim|float) %}
        {% endif %}
    {% endfor %}
    {% for tool in tools %}
        {% set material = (ff.tool_material[tool]|upper) if tool < ff.tool_material|length else '' %}
        {% set material_temp = ff.temps[material] if material in ff.temps else fallback %}
        {% set temp = temps[tool] if tool < temps|length and temps[tool] > 0 else material_temp %}
        {% set extruder = printer["tool T%d" % tool].extruder %}
        {% set nozzle = printer.configfile.settings[extruder].nozzle_diameter|float %}
        {% set speed = ff.load_feed_thin if nozzle <= 0.25 else ff.load_feed %}
        { action_respond_info("nozzle clean T%d at %.0f C" % (tool, temp)) }

        M104 S{temp} T{tool}
        SELECT_TOOL T={tool} RESTORE_AXIS=
        _FF_FILAMENT_PREP TOOL={tool} TEMP={temp} ALLOW_PRINTING=1

        # Once the current nozzle has reached purge temperature, start the
        # following tool while this one is purged, wiped and cooled. This
        # overlaps the otherwise idle heating time without extending how long
        # the next tool waits hot in its dock.
        {% if not loop.last %}
            {% set next_tool = tools[loop.index] %}
            {% set next_material = (ff.tool_material[next_tool]|upper) if next_tool < ff.tool_material|length else '' %}
            {% set next_material_temp = ff.temps[next_material] if next_material in ff.temps else fallback %}
            {% set next_temp = temps[next_tool] if next_tool < temps|length and temps[next_tool] > 0 else next_material_temp %}
            M104 S{next_temp} T{next_tool}
            { action_respond_info("preheating next purge tool T%d to %.0f C" % (next_tool, next_temp)) }
        {% endif %}

        SAVE_GCODE_STATE NAME=_ns_clean
        M83
        G92 E0
        G1 E{ff.purge_length} F{speed}
        M400
        M106 P1 S{(ff.purge_fan * 255)|int}
        # The stock 5 mm purge retract assumes that a prime tower will repay
        # it before the tool reaches the model.  START_PURGE=ALL also supports
        # jobs without a tower, so leave only a small anti-ooze retract here.
        # The toolchange's own travel retract remains independent.
        G1 E-{park_retract} F{speed}
        M400
        G92 E0
        RESTORE_GCODE_STATE NAME=_ns_clean

        _FF_NOZZLE_WIPE TOOL={tool} TEMP={temp}
        _FF_FILAMENT_FINISH RELEASE=0 HEAT_OFF=0
        UNSELECT_TOOL RESTORE_AXIS=
    {% endfor %}


#####################################################################
# Safe manual chute purge
#
# Override the public PURGE macro for the same reason as the sequential clean
# above. During an idle/manual operation, pickup and release must not restore
# the previous XY position: the previous position is commonly the front wipe
# point, and a diagonal restore from the next dock crosses occupied tools.
# The stock paused-print behaviour remains separate and does not change tools.
#####################################################################

[gcode_macro PURGE]
description: Purge at the chute (optional RETRACT, default 0.4 mm)
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set clean = printer["gcode_macro _FF_NOZZLE_CLEAN"] %}
    {% set requested_tool = params.TOOL|default(-1)|int %}
    {% set mounted_tool = printer.ff_toolchange.current_tool|int %}
    {% set tool = mounted_tool if requested_tool < 0 else requested_tool %}
    {% set temp = params.PURGE_TEMP|default(ff.default_temp)|float %}
    {% set length = params.LENGTH|default(ff.purge_length)|float %}
    {% set retract = params.RETRACT|default(clean.park_retract)|float %}
    {% set release = params.RELEASE|default(1)|int %}
    {% set heat_off = params.HEAT_OFF|default(1)|int %}
    {% set wipe = params.WIPE|default(1)|int %}
    {% set state = printer.print_stats.state %}
    {% set paused = printer.pause_resume.is_paused %}

    {% if state == 'printing' and not paused %}
        { action_raise_error("PURGE: refusing while a print is running (pause it first)") }
    {% endif %}
    {% if tool < 0 or tool > 3 %}
        { action_raise_error("PURGE: TOOL=0..3 required when no tool is mounted") }
    {% endif %}
    {% if retract < 0 or retract > 10 %}
        { action_raise_error("PURGE: RETRACT must be between 0 and 10 mm") }
    {% endif %}
    {% if paused and tool != mounted_tool %}
        { action_raise_error("PURGE: paused print has T%d mounted; cannot change to T%d" % (mounted_tool, tool)) }
    {% endif %}

    {% set extruder = printer["tool T%d" % tool].extruder %}
    {% set nozzle = printer.configfile.settings[extruder].nozzle_diameter|float %}
    {% set speed = ff.load_feed_thin if nozzle <= 0.25 else ff.load_feed %}

    {% if not paused %}
        {% if 'xyz' not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        M104 S{temp} T{tool}
        SELECT_TOOL T={tool} RESTORE_AXIS=
    {% endif %}
    _FF_FILAMENT_PREP TOOL={tool} TEMP={temp}

    SAVE_GCODE_STATE NAME=_ns_manual_purge
    M83
    G92 E0
    G1 E{length} F{speed}
    M400
    M106 P1 S{(ff.purge_fan * 255)|int}
    G1 E-{retract} F{speed}
    M400
    G92 E0
    RESTORE_GCODE_STATE NAME=_ns_manual_purge

    {% if wipe %}
        _FF_NOZZLE_WIPE TOOL={tool} TEMP={temp}
    {% else %}
        M106 P1 S0
    {% endif %}

    {% if paused %}
        _FF_FILAMENT_FINISH RELEASE={release} HEAT_OFF={heat_off}
    {% else %}
        _FF_FILAMENT_FINISH RELEASE=0 HEAT_OFF={heat_off}
        {% if release %}
            UNSELECT_TOOL RESTORE_AXIS=
        {% endif %}
    {% endif %}


#####################################################################
# No-prime-tower tool recovery
#
# A real slicer T-change without a registered tower leaves the new tool
# raised at X250. Orca's following native M109 heats it there; ff_extruder
# invokes the recovery macro after the wait, before the slicer travels on.
#####################################################################

[gcode_macro _NS_MARK_TOOL_PRIME]
gcode:
    {% set tool = params.TOOL|int %}
    {% set prime = printer["gcode_macro _NS_TOOLCHANGE_PRIME"] %}
    {% set bit = [1, 2, 4, 8][tool] %}
    {% set already_primed = ((prime.primed_mask|int // bit) % 2) == 1 %}
    SET_GCODE_VARIABLE MACRO=_NS_TOOLCHANGE_PRIME VARIABLE=pending_tool VALUE={tool}
    SET_GCODE_VARIABLE MACRO=_NS_TOOLCHANGE_PRIME VARIABLE=prime_required VALUE={0 if already_primed else 1}


[gcode_macro _NS_TOOLCHANGE_PRIME]
variable_pending_tool: -1
variable_prime_required: 0
variable_primed_mask: 0
variable_length: 5.0
variable_travel_retract: 0.4
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set pending = pending_tool|int %}
    {% set mounted = printer.ff_toolchange.current_tool|int %}
    {% set required = prime_required|int == 1 %}

    {% if pending >= 0 and pending == mounted %}
        {% set extruder = printer["tool T%d" % mounted].extruder %}
        {% set bit = [1, 2, 4, 8][mounted] %}
        {% if required and not printer[extruder].can_extrude %}
            { action_raise_error("Post-toolchange prime: T%d is not hot enough" % mounted) }
        {% endif %}

        {% if required %}
            SAVE_GCODE_STATE NAME=_ns_toolchange_prime
            G90
            M83
            {% if printer.gcode_move.gcode_position.z < ff.purge_z %}
                G1 Z{ff.purge_z} F3000
            {% endif %}
            G1 X{ff.purge_x - 25} F{ff.travel_x_feed}
            G1 Y{ff.purge_y + ff.tool_dy[mounted]} F{ff.travel_y_feed}
            G1 X{ff.purge_x + ff.tool_dx[mounted]} F{ff.approach_feed}
            G1 E{length} F{ff.load_feed}
            M400
            # Depressurize before leaving the chute, then restore the same
            # amount only after the front-right lip wipe.
            G1 E-{travel_retract} F600
            # Leave the chute under retract and cross the front-right
            # silicone lip before pressure is restored. The helper keeps
            # the long Y travel raised and outside the bed edge.
            _NS_CHUTE_LIP_WIPE TOOL={mounted}
            G1 E{travel_retract} F200
            M400
            RESTORE_GCODE_STATE NAME=_ns_toolchange_prime
            SET_GCODE_VARIABLE MACRO=_NS_TOOLCHANGE_PRIME VARIABLE=primed_mask VALUE={primed_mask|int + bit}
            { action_respond_info("First-use chute prime completed for T%d" % mounted) }
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_NS_TOOLCHANGE_PRIME VARIABLE=pending_tool VALUE=-1
        SET_GCODE_VARIABLE MACRO=_NS_TOOLCHANGE_PRIME VARIABLE=prime_required VALUE=0
    {% endif %}


# Filament presence is deliberately independent of purging. fd_exN is the
# switch sensor and can be checked before any extrusion. fm_exN is a motion/
# clog sensor; it is armed automatically for the mounted tool during printing
# and is not suitable as a static preflight check.
[gcode_macro _NS_FILAMENT_PREFLIGHT]
gcode:
    {% set tools = [] %}
    {% for value in (params.TOOLS|default('')|string).split(',') %}
        {% if value|trim != '' and value|trim|int not in tools %}
            {% set _ = tools.append(value|trim|int) %}
        {% endif %}
    {% endfor %}
    {% set missing = [] %}
    {% for tool in tools %}
        {% if tool < 0 or tool > 3 %}
            { action_raise_error("Filament preflight: tool %s is outside 0..3" % tool) }
        {% endif %}
        {% set sensor = "filament_switch_sensor fd_ex%d" % tool %}
        {% if sensor not in printer %}
            { action_raise_error("Filament preflight: %s is not configured" % sensor) }
        {% elif not printer[sensor].filament_detected %}
            {% set _ = missing.append(tool) %}
        {% endif %}
    {% endfor %}
    {% if missing|length > 0 %}
        { action_raise_error("No filament detected in used tool(s): %s" % missing|join(',')) }
    {% endif %}


# ff_print.py calls this wrapper before loading the G-code. It always checks
# every used tool and then forwards either no tools, the initial tool, or all
# tools to the stock FF_BEFORE_PRINT_START/START_PRINT cleaning path.
[gcode_macro _NS_BEFORE_PRINT]
gcode:
    TOOLCHANGE_BEGIN_JOB
    TOOLCHANGE_SET_PRIME_TOWER CLEAR=1
    TOOLCHANGE_PREPARE_PICKUP ENABLE=0
    SET_GCODE_VARIABLE MACRO=_NS_TOOLCHANGE_PRIME VARIABLE=pending_tool VALUE=-1
    SET_GCODE_VARIABLE MACRO=_NS_TOOLCHANGE_PRIME VARIABLE=prime_required VALUE=0
    {% set origin = params.ORIGIN|default('')|string %}
    {% set initial = params.TOOL|default(-1)|int %}
    # The tools the file uses come from ff_print's status; an explicit TOOLS=
    # wins.
    {% set tools = params.TOOLS|default(printer.ff_print.tools|join(','))|string|trim %}
    {% set purge_mode = printer["gcode_macro START_PURGE_SET"].mode|int %}
    {% set initial_bit = [1, 2, 4, 8][initial] if initial >= 0 and initial <= 3 else 0 %}
    # The initial tool is prepared by the startup purge line. ALL additionally
    # prepares every used tool in the pre-print cleaning pass, so no in-print
    # first-use chute purge is needed in that mode.
    SET_GCODE_VARIABLE MACRO=_NS_TOOLCHANGE_PRIME VARIABLE=primed_mask VALUE={15 if purge_mode == 2 else initial_bit}
    {% set check_tools = tools if tools else (initial|string if initial >= 0 else '') %}

    {% if check_tools %}
        _FF_PREFLIGHT TOOL={initial} TOOLS={check_tools}
        _NS_FILAMENT_PREFLIGHT TOOLS={check_tools}
    {% endif %}

    FF_BEFORE_PRINT_START ORIGIN={origin}{% if 'BED' in params %} BED={params.BED}{% endif %}{% if initial >= 0 %} TOOL={initial}{% endif %}{% if 'NOZZLE' in params %} NOZZLE={params.NOZZLE}{% endif %}{% if 'LAYER' in params %} LAYER={params.LAYER}{% endif %} CLEAN={0 if purge_mode == 0 else 1} DEFER_MESH=1{% if purge_mode == 2 and tools %} TOOLS={tools}{% endif %}


# Replace only ff_print's callback; the stock lifecycle macros remain intact.
[ff_print]
before_macro: _NS_BEFORE_PRINT


[delayed_gcode _RESTORE_N4S4_PERSISTENT_SETTINGS]
initial_duration: 1.0
gcode:
    {% set saved = printer.save_variables.variables %}
    {% set timelapse_enabled = saved.timelapse_enabled|default(0)|int %}
    {% set start_purge_mode = saved.start_purge_mode|default(1)|int %}
    {% if start_purge_mode < 0 or start_purge_mode > 2 %}
        {% set start_purge_mode = 1 %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=enable VALUE={True if timelapse_enabled else False}
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=disabled_notice VALUE=False
    SET_GCODE_VARIABLE MACRO=START_PURGE_SET VARIABLE=mode VALUE={start_purge_mode}
    {% if timelapse_enabled %}
        { action_respond_info("Restored persistent setting: Timelapse ENABLED") }
    {% else %}
        { action_respond_info("Restored persistent setting: Timelapse DISABLED") }
    {% endif %}
    {% set purge_label = 'OFF' if start_purge_mode == 0 else ('FIRST' if start_purge_mode == 1 else 'ALL') %}
    { action_respond_info("Restored persistent setting: Pre-print chute purge %s" % purge_label) }


#####################################################################
# Adaptive mesh
#
# ADAPTIVE_MESH_TOGGLE and ADAPTIVE_MESH_STATUS (the Mainsail buttons that
# switch between probing a fresh adaptive mesh and loading MESH_DATA) and the
# basic ADAPTIVE_MESH come from ff-print-macros.cfg. ADAPTIVE_MESH is
# redefined below, and only to add what the original does not do:
#   * PLATE=<code>      a first-layer Z correction per build plate, taken from
#                       _BUILD_PLATE_OFFSETS and handed to
#                       TOOLCHANGE_SET_PRINT_OFFSET PLATE=
#   * TOOLCHANGE_PREPARE_PICKUP before the first pickup, because a purge
#                       line follows it
#   * the preheat of the file's second tool once the mesh is done
# The rest is the original's. qa/static/test_n4s4_overrides.py renders both
# and fails when they drift apart, so an upstream change cannot be shadowed
# unnoticed.
#####################################################################

[gcode_macro ADAPTIVE_MESH]
description: Prepare the adaptive or saved bed mesh, grab the first tool, set the print offset
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set nozzle = params.NOZZLE|default(220)|float %}
    {% set bed = params.BED|default(0)|float %}
    {% set layer = params.LAYER|default(0)|float %}
    {% set margin = params.MARGIN|default(16)|float %}
    {% set plate = params.PLATE|default('DEFAULT')|upper %}
    {% set plates = printer["gcode_macro _BUILD_PLATE_OFFSETS"] %}
    {% set adaptive = printer["gcode_macro ADAPTIVE_MESH_TOGGLE"].enabled|int %}

    {% if plate == 'DEFAULT' %}
        {% set plate_offset = 0.0 %}
    {% elif plate == 'SMOOTH_COOL' or plate == 'COOL' %}
        {% set plate_offset = plates.smooth_cool|float %}
    {% elif plate == 'SMOOTH_HIGH_TEMP' or plate == 'HIGH_TEMP' %}
        {% set plate_offset = plates.smooth_high_temp|float %}
    {% elif plate == 'TEXTURED_COOL' %}
        {% set plate_offset = plates.textured_cool|float %}
    {% elif plate == 'TEXTURED_PEI' or plate == 'STRUCTURED_PEI' %}
        {% set plate_offset = plates.textured_pei|float %}
    {% elif plate == 'ENGINEERING' %}
        {% set plate_offset = plates.engineering|float %}
    {% elif plate == 'SUPERTACK' %}
        {% set plate_offset = plates.supertack|float %}
    {% else %}
        { action_raise_error("ADAPTIVE_MESH: unknown build plate code '%s'" % plate) }
    {% endif %}

    { action_respond_info(
        "Build plate %s: print Z correction %+.3f mm"
        % (plate, plate_offset)
    ) }

    TOOLCHANGE_SET_PRINT_OFFSET CLEAR=1

    TOOLCHANGE_PARK

    G28 Z

    BED_MESH_CLEAR
    {% if adaptive %}
        { action_respond_info("Bed mesh mode: ADAPTIVE (probing a new mesh)") }
        SET_VELOCITY_LIMIT ACCEL=2000
        M106 P1 S0
        BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN={margin}
        SET_VELOCITY_LIMIT ACCEL=20000
    {% else %}
        { action_respond_info("Bed mesh mode: SAVED (loading MESH_DATA)") }
        BED_MESH_PROFILE LOAD=MESH_DATA
    {% endif %}

    G1 Z10 F1200

    M104 S{nozzle} T{tool}
    # _PURGE_NEAR_OBJECT follows this initial pickup in the Orca start code,
    # so the larger retract cannot create a missing first model extrusion.
    TOOLCHANGE_PREPARE_PICKUP
    T{tool}

    TOOLCHANGE_SET_PRINT_OFFSET NOZZLE={nozzle} BED={bed} LAYER={layer} PLATE={plate_offset} TOOL={tool}

    # Orca inserts ordinary M104 preheat commands at its configured lead
    # time. If the first colour is shorter than that interval, the ideal M104
    # would fall inside machine-start G-code and cannot be emitted in the
    # object body. ff_print resolves that second tool and its first M109
    # target, so start it here after probing rather than waiting for pickup.
    {% set next_tool = printer.ff_print.next_tool %}
    {% set next_nozzle = printer.ff_print.next_nozzle %}
    {% if next_tool is not none and next_nozzle is not none and next_tool|int != tool %}
        M104 S{next_nozzle|int} T{next_tool|int}
        { action_respond_info("Preheating next tool T%d to %d C after mesh" % (next_tool|int, next_nozzle|int)) }
    {% endif %}


#####################################################################
# Prime Tower registration
#
# The macro itself is ff-print-macros.cfg's: it registers Orca's real tower
# as an excluded object so the adaptive mesh covers it, from the values
# ff_print reads out of the file (the numbers Orca expands into the start
# G-code can belong to another plate). It is redefined here with ONE added
# line, TOOLCHANGE_SET_PRIME_TOWER, which gives the toolchanger the same
# rectangle. qa/static/test_n4s4_overrides.py renders both and fails when
# they drift apart.
#####################################################################

[gcode_macro DEFINE_PRIME_TOWER_OBJECT]
description: Register Orca's actual prime tower for the mesh and for tool changes
gcode:
    {% set parsed = printer.ff_print %}
    {% set x = parsed.prime_tower_x|float if parsed.prime_tower_x is not none else params.X|float %}
    {% set y = parsed.prime_tower_y|float if parsed.prime_tower_y is not none else params.Y|float %}
    {% set width = parsed.prime_tower_width|float if parsed.prime_tower_width is not none else params.WIDTH|float %}
    {% set depth = parsed.prime_tower_depth|float if parsed.prime_tower_depth is not none else params.DEPTH|default(width)|float %}
    {% set raw_brim = parsed.prime_tower_brim|float if parsed.prime_tower_brim is not none else params.BRIM|default(0)|float %}
    {% set brim = [raw_brim, 0.0]|max %}
    {% set rot = parsed.prime_tower_rotation|float if parsed.prime_tower_rotation is not none else params.ROT|default(0)|float %}
    {% set safety = 1.0 %}

    {% if parsed.prime_tower_x is not none and params.X is defined and
          ((params.X|float - x)|abs > 0.001 or (params.Y|float - y)|abs > 0.001) %}
        { action_respond_info(
            "Prime Tower: replacing the start G-code's %.3f,%.3f with the active plate's %.3f,%.3f"
            % (params.X|float, params.Y|float, x, y)) }
    {% endif %}

    {% set cx = parsed.prime_tower_center_x|float if parsed.prime_tower_center_x is not none else x + width / 2.0 %}
    {% set cy = parsed.prime_tower_center_y|float if parsed.prime_tower_center_y is not none else y + depth / 2.0 %}
    {% set hx = width / 2.0 + brim + safety %}
    {% set hy = depth / 2.0 + brim + safety %}

    {% if parsed.prime_tower_outer_min_x is not none %}
        {% set xmin = parsed.prime_tower_outer_min_x|float - safety %}
        {% set xmax = parsed.prime_tower_outer_max_x|float + safety %}
        {% set ymin = parsed.prime_tower_outer_min_y|float - safety %}
        {% set ymax = parsed.prime_tower_outer_max_y|float + safety %}
    {% elif parsed.prime_tower_core_min_x is not none %}
        {% set xmin = parsed.prime_tower_core_min_x|float - brim - safety %}
        {% set xmax = parsed.prime_tower_core_max_x|float + brim + safety %}
        {% set ymin = parsed.prime_tower_core_min_y|float - brim - safety %}
        {% set ymax = parsed.prime_tower_core_max_y|float + brim + safety %}
    {% else %}
        ; No measured outline: a square that holds the tower at any rotation.
        {% set r = 1.414214 * ([hx, hy]|max) %}
        {% set xmin = cx - r %}
        {% set xmax = cx + r %}
        {% set ymin = cy - r %}
        {% set ymax = cy + r %}
    {% endif %}

    { action_respond_info(
        "Prime Tower: center %.3f,%.3f nominal %.3fx%.3f brim %.3f rotation %.1f, mesh bounds X %.3f..%.3f Y %.3f..%.3f"
        % (cx, cy, width, depth, brim, rot, xmin, xmax, ymin, ymax)) }
    ; N4S4: also tell the toolchanger where the tower is, so a tool change over
    ; the model does not return there (see ff_toolchange TOOLCHANGE_SET_PRIME_TOWER).
    TOOLCHANGE_SET_PRIME_TOWER CENTER_X={cx} CENTER_Y={cy} WIDTH={width} DEPTH={depth} BRIM={brim} ROT={rot} SAFETY={safety}
    EXCLUDE_OBJECT_DEFINE NAME=PRIME_TOWER CENTER={cx},{cy} POLYGON=[[{xmin},{ymin}],[{xmax},{ymin}],[{xmax},{ymax}],[{xmin},{ymax}],[{xmin},{ymin}]]


#####################################################################
# Purge line near current print objects
#####################################################################

[gcode_macro _PURGE_NEAR_OBJECT]
description: Print the purge line close to the current print objects
gcode:
    {% set bed_min_x = -1.0 %}
    {% set bed_max_x = 257.0 %}
    {% set bed_min_y = -1.0 %}
    {% set bed_max_y = 257.0 %}

    {% set gap = params.GAP|default(12)|float %}
    {% set margin = params.MARGIN|default(16)|float %}
    {% set z = params.Z|default(0.2)|float %}
    {% set e = params.E|default(10)|float %}
    {% set lead = [params.LEAD|default(3)|float, e]|min %}
    {% set feed = params.F|default(600)|float %}

    {% set objects = printer.exclude_object.objects %}

    {% if objects|length == 0 %}
        { action_raise_error(
            "_PURGE_NEAR_OBJECT: no EXCLUDE_OBJECT definitions available"
        ) }
    {% endif %}

    {% set ns = namespace(
        xmin=9999.0,
        xmax=-9999.0,
        ymin=9999.0,
        ymax=-9999.0
    ) %}

    {% for object in objects %}
        {% for p in object.polygon %}
            {% set px = p[0]|float %}
            {% set py_obj = p[1]|float %}

            {% if px < ns.xmin %}
                {% set ns.xmin = px %}
            {% endif %}

            {% if px > ns.xmax %}
                {% set ns.xmax = px %}
            {% endif %}

            {% if py_obj < ns.ymin %}
                {% set ns.ymin = py_obj %}
            {% endif %}

            {% if py_obj > ns.ymax %}
                {% set ns.ymax = py_obj %}
            {% endif %}
        {% endfor %}
    {% endfor %}

    {% set cx = (ns.xmin + ns.xmax) / 2.0 %}

    {% set x1 = [cx - 25.0, ns.xmin - margin + 1.0, bed_min_x]|max %}
    {% set x2 = [cx + 25.0, ns.xmax + margin - 1.0, bed_max_x]|min %}

    {% if ns.ymin - gap >= bed_min_y %}
        {% set py = ns.ymin - gap %}
    {% else %}
        {% set py = ns.ymax + gap %}
    {% endif %}

    {% set py = [[py, bed_min_y]|max, bed_max_y]|min %}

    {% if x2 - x1 < 20.0 %}
        { action_raise_error(
            "_PURGE_NEAR_OBJECT: not enough safe X distance for purge line"
        ) }
    {% endif %}

    { action_respond_info(
        "Purge line: X %.1f..%.1f Y %.1f; object bounds X %.1f..%.1f Y %.1f..%.1f"
        % (x1, x2, py, ns.xmin, ns.xmax, ns.ymin, ns.ymax)
    ) }

    G90
    M83

    G1 Z5 F2400
    G1 X{x1} Y{py} F6000
    G1 Z{z} F1200

    # A short stationary prime fills the remaining pressure deficit. Spread
    # most of the requested extrusion over the moving line to avoid the old
    # E8 start blob and excessively wide E25 line.
    G1 E{lead} F{feed}
    G1 X{x2} E{e - lead} F{feed}
