#####################################################################
# Creator 5 N4S4 local configuration
#
# This file contains the N4S4 printer overrides and integration macros.
# It also enables the shared-extruder adapter exactly once; ff-toolchange.cfg
# deliberately does not repeat that section.
#
# It is intended to be included from printer.cfg before SAVE_CONFIG:
#
#   [include printer_n4s4.cfg]
#
#####################################################################

#####################################################################
# Raise before crossing to the old tool's dock and keep Z raised throughout
# the exchange. Restore XY when T<n> was issued inside the registered prime
# tower. If Orca issued T<n> over the previously printed object, skip that
# restore so the new tool cannot lower and leave a dot on the object; Orca's
# following travel takes the raised/retracted tool to the prime tower.
# Values are mm, feeds are mm/min.
#####################################################################

# Creator 5 has four logical hotends but one physical filament stepper.
# This extra adapts unmodified Klipper extruder.py before toolhead creates the
# extruders, so [extruder1]..[extruder3] keep their heaters and motion queues
# without attempting to register the repeated physical stepper pins.
[ff_extruder]
shared_extruder: extruder

#####################################################################
# Tool-change travel and pressure handling
#####################################################################

[ff_toolchange]
restore_axis: xy
restore_feed: 30000
restore_z_hop: 2.0
restore_z_feed: 1200
restore_retract: 2.0
restore_retract_feed: 1800
restore_unretract: 0.4
restore_unretract_feed: 200


[gcode_macro TOOLCHANGE_STATUS]
description: Show toolchanger sensors, geometry, offsets and active tool
gcode:
    FF_TOOLCHANGE_STATUS


#####################################################################
# just 1 sample to save time
#####################################################################

[probe]
samples: 1


#####################################################################
# faster bed mesh
#####################################################################

[bed_mesh]
speed: 300
horizontal_move_z: 3
move_check_distance: 3
mesh_min: 0, 0
mesh_max: 250, 250
# probe_count: 5, 5
probe_count: 8, 8
mesh_pps: 3, 3
algorithm: bicubic
bicubic_tension: 0.8
# fade_start: 0.5
# fade_end: 5.5
# #fade_target: 0

# Creator 5 contact-probe optimization.  The first point is approached at an
# absolute Z=5 mm.  Later moves lift 2 mm relative to the last trigger point.
# If that calculated travel height would be below Z=1 mm, Z=3 mm is used.
# The decision is recalculated after every probe, so recovery Z=3 is not
# retained once the normal 2 mm clearance is safe again. Klipper's standard
# row-by-row point order remains unchanged.
[ff_bed_mesh]
first_move_z: 5.0
travel_clearance: 2.0
low_height_threshold: 1.0
recovery_move_z: 3.0


#####################################################################
# Shared 24V hotend power
#####################################################################

[output_pin DC24V_CTL]
pin: eheaterboard:PA3
value: 1
shutdown_value: 0


#####################################################################
# Shared physical extruder stepper
#
# Only [extruder] owns the physical stepper.
# extruder1..extruder3 remain logical hotends only.
#####################################################################

[extruder]
step_pin: eboard:PB14
dir_pin: eboard:PB15
enable_pin: !eboard:PB12
microsteps: 16
gear_ratio: 6.5:1
rotation_distance: 19.15
full_steps_per_rotation: 200

pressure_advance: 0.02
pressure_advance_smooth_time: 0.02


#####################################################################
# Per-build-plate first-layer Z corrections
#
# Positive values raise the nozzle (less squish); negative values lower it
# (more squish). Keep one reference plate at 0.000 and calibrate the others
# with the same reference filament. Orca passes one of the symbolic codes
# handled by ADAPTIVE_MESH below.
# defaults here are based on PLA filament - need per filament adjustments (esp. for eg. PETG)
#####################################################################

[gcode_macro _BUILD_PLATE_OFFSETS]
variable_smooth_cool: 0.000
variable_smooth_high_temp: 0.000
variable_textured_cool: 0.000
variable_textured_pei: 0.03
variable_engineering: 0.000
variable_supertack: 0.000
gcode:
    { action_respond_info("Edit this macro's variables to calibrate build-plate Z offsets") }


#####################################################################
# Persistent local settings
#
# Klipper creates/updates this file on the printer. It stores the timelapse
# switch so its state survives FIRMWARE_RESTART and a complete reboot.
#####################################################################

[save_variables]
filename: /usr/data/anvil-data/config/n4s4_saved_variables.cfg


#####################################################################
# Timelapse mode
#
# Visible in Mainsail. Clicking without parameters toggles frame capture;
# the console form can also set it explicitly:
#   TIMELAPSE_TOGGLE ENABLE=1
#   TIMELAPSE_TOGGLE ENABLE=0
# Orca can keep calling TIMELAPSE_TAKE_FRAME unconditionally. The existing
# timelapse macro ignores those calls while its enable variable is false.
#####################################################################

[gcode_macro TIMELAPSE_TOGGLE]
description: Toggle timelapse frame capture and save the setting
gcode:
    {% set timelapse = printer["gcode_macro TIMELAPSE_TAKE_FRAME"] %}
    {% if 'ENABLE' in params %}
        {% set next = params.ENABLE|int %}
        {% if next != 0 and next != 1 %}
            { action_raise_error("TIMELAPSE_TOGGLE: ENABLE must be 0 or 1") }
        {% endif %}
    {% else %}
        {% set next = 0 if timelapse.enable else 1 %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=enable VALUE={True if next else False}
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=disabled_notice VALUE=False
    SAVE_VARIABLE VARIABLE=timelapse_enabled VALUE={next}

    {% if next %}
        { action_respond_info("Timelapse ENABLED: Orca frame requests will be captured") }
    {% else %}
        { action_respond_info("Timelapse DISABLED: Orca frame requests will be ignored") }
    {% endif %}


#####################################################################
# Pre-print purge mode
#
# Visible in Mainsail. Clicking cycles FIRST -> ALL -> OFF. The console form
# selects a mode directly:
#   START_PURGE_SET MODE=OFF
#   START_PURGE_SET MODE=FIRST
#   START_PURGE_SET MODE=ALL
# The setting is persistent. FIRST preserves the previous behaviour; ALL
# purges every tool used by the G-code at the rear-right purge chute.
#####################################################################

[gcode_macro START_PURGE_SET]
description: Select persistent pre-print chute purge mode (OFF/FIRST/ALL)
variable_mode: 1
gcode:
    {% set requested = params.MODE|default('')|string|upper %}
    {% if requested == '' %}
        {% set next = (mode|int + 1) % 3 %}
    {% elif requested == 'OFF' or requested == '0' %}
        {% set next = 0 %}
    {% elif requested == 'FIRST' or requested == '1' %}
        {% set next = 1 %}
    {% elif requested == 'ALL' or requested == '2' %}
        {% set next = 2 %}
    {% else %}
        { action_raise_error("START_PURGE_SET: MODE must be OFF, FIRST or ALL") }
    {% endif %}

    SET_GCODE_VARIABLE MACRO=START_PURGE_SET VARIABLE=mode VALUE={next}
    SAVE_VARIABLE VARIABLE=start_purge_mode VALUE={next}

    {% set label = 'OFF' if next == 0 else ('FIRST' if next == 1 else 'ALL') %}
    { action_respond_info("Pre-print chute purge mode: %s" % label) }


[gcode_macro START_PURGE_STATUS]
description: Show the current pre-print chute purge mode
gcode:
    {% set mode = printer["gcode_macro START_PURGE_SET"].mode|int %}
    {% set label = 'OFF' if mode == 0 else ('FIRST' if mode == 1 else 'ALL') %}
    { action_respond_info("Pre-print chute purge mode: %s" % label) }


#####################################################################
# Fixed front-wipe temperature
#
# The stock implementation uses purge temperature minus clean_cool_delta,
# producing a different wipe temperature for every material. Use one absolute
# target instead; 150 C keeps the filament soft enough to avoid a brittle,
# overly cold wipe while still reducing ooze before the tool is docked.
#####################################################################

[gcode_macro _FF_FILAMENT]
variable_clean_wipe_temp: 150.0


[gcode_macro _FF_NOZZLE_WIPE]
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set tool = params.TOOL|int %}
    {% set purge_temp = params.TEMP|float %}
    {% set extruder = printer["tool T%d" % tool].extruder %}
    {% set wipe_temp = [ff.clean_wipe_temp|float, purge_temp]|min %}
    {% set wipe_z = ff.clean_wipe_z - printer.gcode_move.homing_origin.z
                    - printer["tool T%d" % tool].gcode_z_offset
                    - printer.toolchanger.print_z_offset %}

    G90
    G1 X{ff.purge_x - 25} F{ff.clean_wipe_feed}
    G1 Y{ff.clean_wipe_y} F{ff.travel_y_feed}
    G1 X{ff.clean_wipe_x} F{ff.clean_wipe_feed}
    G1 Z{wipe_z} F{ff.clean_wipe_z_feed}
    M400

    {% if wipe_temp > 0 and purge_temp > wipe_temp %}
        M104 S{wipe_temp} T{tool}
        TEMPERATURE_WAIT SENSOR={extruder} MAXIMUM={wipe_temp + 3}
    {% endif %}

    M106 P1 S0
    G1 Z10 F1200
    M400


#####################################################################
# Safe sequential chute purge
#
# Override the stock _FF_NOZZLE_CLEAN body while keeping its helpers and
# tunables. Global restore_axis=xy is correct for slicer tool changes, but it
# is unsafe between consecutive cleaning passes: after docking one tool it
# returns the empty carriage to the front wipe position, and after grabbing
# the next one it crosses the occupied dock area diagonally. Explicitly empty
# RESTORE_AXIS keeps each pickup/release at the toolchanger's safe X position.
#####################################################################

[gcode_macro _FF_NOZZLE_CLEAN]
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set fallback = params.TEMP|default(ff.default_temp)|float %}
    {% set tools = [] %}
    {% for value in (params.TOOLS|default('')|string).split(',') %}
        {% if value|trim != '' and value|trim|int not in tools %}
            {% set _ = tools.append(value|trim|int) %}
        {% endif %}
    {% endfor %}
    {% set temps = [] %}
    {% for value in (params.TEMPS|default('')|string).split(',') %}
        {% if value|trim != '' %}
            {% set _ = temps.append(value|trim|float) %}
        {% endif %}
    {% endfor %}
    {% for tool in tools %}
        {% set material = (ff.tool_material[tool]|upper) if tool < ff.tool_material|length else '' %}
        {% set material_temp = ff.temps[material] if material in ff.temps else fallback %}
        {% set temp = temps[tool] if tool < temps|length and temps[tool] > 0 else material_temp %}
        {% set extruder = printer["tool T%d" % tool].extruder %}
        {% set nozzle = printer.configfile.settings[extruder].nozzle_diameter|float %}
        {% set speed = ff.load_feed_thin if nozzle <= 0.25 else ff.load_feed %}
        { action_respond_info("nozzle clean T%d at %.0f C" % (tool, temp)) }

        M104 S{temp} T{tool}
        SELECT_TOOL T={tool} RESTORE_AXIS=
        _FF_FILAMENT_PREP TOOL={tool} TEMP={temp} ALLOW_PRINTING=1

        SAVE_GCODE_STATE NAME=_ns_clean
        M83
        G92 E0
        G1 E{ff.purge_length} F{speed}
        M400
        M106 P1 S{(ff.purge_fan * 255)|int}
        G1 E-{ff.purge_retract} F{speed}
        M400
        G92 E0
        RESTORE_GCODE_STATE NAME=_ns_clean

        _FF_NOZZLE_WIPE TOOL={tool} TEMP={temp}
        _FF_FILAMENT_FINISH RELEASE=0 HEAT_OFF=0
        UNSELECT_TOOL RESTORE_AXIS=
    {% endfor %}


#####################################################################
# Safe manual chute purge
#
# Override the public PURGE macro for the same reason as the sequential clean
# above. During an idle/manual operation, pickup and release must not restore
# the previous XY position: the previous position is commonly the front wipe
# point, and a diagonal restore from the next dock crosses occupied tools.
# The stock paused-print behaviour remains separate and does not change tools.
#####################################################################

[gcode_macro PURGE]
description: Purge at the chute using the safe X250 toolchange corridor
gcode:
    {% set ff = printer["gcode_macro _FF_FILAMENT"] %}
    {% set requested_tool = params.TOOL|default(-1)|int %}
    {% set mounted_tool = printer.ff_toolchange.current_tool|int %}
    {% set tool = mounted_tool if requested_tool < 0 else requested_tool %}
    {% set temp = params.PURGE_TEMP|default(ff.default_temp)|float %}
    {% set length = params.LENGTH|default(ff.purge_length)|float %}
    {% set release = params.RELEASE|default(1)|int %}
    {% set heat_off = params.HEAT_OFF|default(1)|int %}
    {% set wipe = params.WIPE|default(1)|int %}
    {% set state = printer.print_stats.state %}
    {% set paused = printer.pause_resume.is_paused %}

    {% if state == 'printing' and not paused %}
        { action_raise_error("PURGE: refusing while a print is running (pause it first)") }
    {% endif %}
    {% if tool < 0 or tool > 3 %}
        { action_raise_error("PURGE: TOOL=0..3 required when no tool is mounted") }
    {% endif %}
    {% if paused and tool != mounted_tool %}
        { action_raise_error("PURGE: paused print has T%d mounted; cannot change to T%d" % (mounted_tool, tool)) }
    {% endif %}

    {% set extruder = printer["tool T%d" % tool].extruder %}
    {% set nozzle = printer.configfile.settings[extruder].nozzle_diameter|float %}
    {% set speed = ff.load_feed_thin if nozzle <= 0.25 else ff.load_feed %}

    {% if not paused %}
        {% if 'xyz' not in printer.toolhead.homed_axes %}
            G28
        {% endif %}
        M104 S{temp} T{tool}
        SELECT_TOOL T={tool} RESTORE_AXIS=
    {% endif %}
    _FF_FILAMENT_PREP TOOL={tool} TEMP={temp}

    SAVE_GCODE_STATE NAME=_ns_manual_purge
    M83
    G92 E0
    G1 E{length} F{speed}
    M400
    M106 P1 S{(ff.purge_fan * 255)|int}
    G1 E-{ff.purge_retract} F{speed}
    M400
    G92 E0
    RESTORE_GCODE_STATE NAME=_ns_manual_purge

    {% if wipe %}
        _FF_NOZZLE_WIPE TOOL={tool} TEMP={temp}
    {% else %}
        M106 P1 S0
    {% endif %}

    {% if paused %}
        _FF_FILAMENT_FINISH RELEASE={release} HEAT_OFF={heat_off}
    {% else %}
        _FF_FILAMENT_FINISH RELEASE=0 HEAT_OFF={heat_off}
        {% if release %}
            UNSELECT_TOOL RESTORE_AXIS=
        {% endif %}
    {% endif %}


# Filament presence is deliberately independent of purging. fd_exN is the
# switch sensor and can be checked before any extrusion. fm_exN is a motion/
# clog sensor; it is armed automatically for the mounted tool during printing
# and is not suitable as a static preflight check.
[gcode_macro _NS_FILAMENT_PREFLIGHT]
gcode:
    {% set tools = [] %}
    {% for value in (params.TOOLS|default('')|string).split(',') %}
        {% if value|trim != '' and value|trim|int not in tools %}
            {% set _ = tools.append(value|trim|int) %}
        {% endif %}
    {% endfor %}
    {% set missing = [] %}
    {% for tool in tools %}
        {% if tool < 0 or tool > 3 %}
            { action_raise_error("Filament preflight: tool %s is outside 0..3" % tool) }
        {% endif %}
        {% set sensor = "filament_switch_sensor fd_ex%d" % tool %}
        {% if sensor not in printer %}
            { action_raise_error("Filament preflight: %s is not configured" % sensor) }
        {% elif not printer[sensor].filament_detected %}
            {% set _ = missing.append(tool) %}
        {% endif %}
    {% endfor %}
    {% if missing|length > 0 %}
        { action_raise_error("No filament detected in used tool(s): %s" % missing|join(',')) }
    {% endif %}


# ff_print.py calls this wrapper before loading the G-code. It always checks
# every used tool and then forwards either no tools, the initial tool, or all
# tools to the stock FF_BEFORE_PRINT_START/START_PRINT cleaning path.
[gcode_macro _NS_BEFORE_PRINT]
gcode:
    TOOLCHANGE_SET_PRIME_TOWER CLEAR=1
    {% set origin = params.ORIGIN|default('')|string %}
    {% set initial = params.TOOL|default(-1)|int %}
    {% set tools = params.TOOLS|default('')|string|trim %}
    {% set purge_mode = printer["gcode_macro START_PURGE_SET"].mode|int %}
    {% set check_tools = tools if tools else (initial|string if initial >= 0 else '') %}

    {% if check_tools %}
        _FF_PREFLIGHT TOOL={initial} TOOLS={check_tools}
        _NS_FILAMENT_PREFLIGHT TOOLS={check_tools}
    {% endif %}

    FF_BEFORE_PRINT_START ORIGIN={origin}{% if 'BED' in params %} BED={params.BED}{% endif %}{% if initial >= 0 %} TOOL={initial}{% endif %}{% if 'NOZZLE' in params %} NOZZLE={params.NOZZLE}{% endif %}{% if 'LAYER' in params %} LAYER={params.LAYER}{% endif %} CLEAN={0 if purge_mode == 0 else 1}{% if purge_mode == 2 and tools %} TOOLS={tools}{% endif %}


# Replace only ff_print's callback; the stock lifecycle macros remain intact.
[ff_print]
before_macro: _NS_BEFORE_PRINT


[delayed_gcode _RESTORE_N4S4_PERSISTENT_SETTINGS]
initial_duration: 1.0
gcode:
    {% set saved = printer.save_variables.variables %}
    {% set timelapse_enabled = saved.timelapse_enabled|default(0)|int %}
    {% set start_purge_mode = saved.start_purge_mode|default(1)|int %}
    {% if start_purge_mode < 0 or start_purge_mode > 2 %}
        {% set start_purge_mode = 1 %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=enable VALUE={True if timelapse_enabled else False}
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_TAKE_FRAME VARIABLE=disabled_notice VALUE=False
    SET_GCODE_VARIABLE MACRO=START_PURGE_SET VARIABLE=mode VALUE={start_purge_mode}
    {% if timelapse_enabled %}
        { action_respond_info("Restored persistent setting: Timelapse ENABLED") }
    {% else %}
        { action_respond_info("Restored persistent setting: Timelapse DISABLED") }
    {% endif %}
    {% set purge_label = 'OFF' if start_purge_mode == 0 else ('FIRST' if start_purge_mode == 1 else 'ALL') %}
    { action_respond_info("Restored persistent setting: Pre-print chute purge %s" % purge_label) }


#####################################################################
# Adaptive mesh mode
#
# Visible in Mainsail. Clicking without parameters toggles the mode; the
# console form can also set it explicitly:
#   ADAPTIVE_MESH_TOGGLE ENABLE=1
#   ADAPTIVE_MESH_TOGGLE ENABLE=0
# The setting is session-local and safely defaults to enabled after restart.
#####################################################################

[gcode_macro ADAPTIVE_MESH_TOGGLE]
description: Toggle adaptive mesh (enabled uses a new mesh; disabled loads MESH_DATA)
variable_enabled: 1
gcode:
    {% if 'ENABLE' in params %}
        {% set next = params.ENABLE|int %}
        {% if next != 0 and next != 1 %}
            { action_raise_error("ADAPTIVE_MESH_TOGGLE: ENABLE must be 0 or 1") }
        {% endif %}
    {% else %}
        {% set next = 0 if enabled|int else 1 %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=ADAPTIVE_MESH_TOGGLE VARIABLE=enabled VALUE={next}

    {% if next %}
        { action_respond_info("Adaptive mesh ENABLED: the next print will probe a new adaptive mesh") }
    {% else %}
        { action_respond_info("Adaptive mesh DISABLED: the next print will load MESH_DATA") }
    {% endif %}


[gcode_macro ADAPTIVE_MESH_STATUS]
description: Show whether adaptive mesh probing is enabled
gcode:
    {% set enabled = printer["gcode_macro ADAPTIVE_MESH_TOGGLE"].enabled|int %}
    {% if enabled %}
        { action_respond_info("Adaptive mesh is ENABLED: the next print will probe a new adaptive mesh") }
    {% else %}
        { action_respond_info("Adaptive mesh is DISABLED: the next print will load MESH_DATA") }
    {% endif %}


#####################################################################
# Safe print mesh setup
#####################################################################

[gcode_macro ADAPTIVE_MESH]
description: Prepare the selected adaptive or saved bed mesh for the print
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set nozzle = params.NOZZLE|default(220)|float %}
    {% set bed = params.BED|default(0)|float %}
    {% set layer = params.LAYER|default(0)|float %}
    {% set margin = params.MARGIN|default(16)|float %}
    {% set plate = params.PLATE|default('DEFAULT')|upper %}
    {% set plates = printer["gcode_macro _BUILD_PLATE_OFFSETS"] %}
    {% set adaptive = printer["gcode_macro ADAPTIVE_MESH_TOGGLE"].enabled|int %}

    {% if plate == 'DEFAULT' %}
        {% set plate_offset = 0.0 %}
    {% elif plate == 'SMOOTH_COOL' or plate == 'COOL' %}
        {% set plate_offset = plates.smooth_cool|float %}
    {% elif plate == 'SMOOTH_HIGH_TEMP' or plate == 'HIGH_TEMP' %}
        {% set plate_offset = plates.smooth_high_temp|float %}
    {% elif plate == 'TEXTURED_COOL' %}
        {% set plate_offset = plates.textured_cool|float %}
    {% elif plate == 'TEXTURED_PEI' or plate == 'STRUCTURED_PEI' %}
        {% set plate_offset = plates.textured_pei|float %}
    {% elif plate == 'ENGINEERING' %}
        {% set plate_offset = plates.engineering|float %}
    {% elif plate == 'SUPERTACK' %}
        {% set plate_offset = plates.supertack|float %}
    {% else %}
        { action_raise_error("ADAPTIVE_MESH: unknown build plate code '%s'" % plate) }
    {% endif %}

    { action_respond_info(
        "Build plate %s: print Z correction %+.3f mm"
        % (plate, plate_offset)
    ) }

    TOOLCHANGE_SET_PRINT_OFFSET CLEAR=1

    TOOLCHANGE_PARK

    G28 Z

    BED_MESH_CLEAR
    {% if adaptive %}
        { action_respond_info("Bed mesh mode: ADAPTIVE (probing a new mesh)") }
        SET_VELOCITY_LIMIT ACCEL=2000
        M106 P1 S0
        BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN={margin}
        SET_VELOCITY_LIMIT ACCEL=20000
    {% else %}
        { action_respond_info("Bed mesh mode: SAVED (loading MESH_DATA)") }
        BED_MESH_PROFILE LOAD=MESH_DATA
    {% endif %}

    G1 Z10 F1200

    T{tool}

    TOOLCHANGE_SET_PRINT_OFFSET NOZZLE={nozzle} BED={bed} LAYER={layer} PLATE={plate_offset} TOOL={tool}


#####################################################################
# Prime Tower registration
#
# ff_print.py supplies the active plate's resolved position and recovers the
# generated second dimension from Orca's actual tower outline. Parameters from
# machine start G-code remain the fallback for files without parsed metadata.
#####################################################################

[gcode_macro DEFINE_PRIME_TOWER_OBJECT]
description: Register Orca's actual Prime Tower for mesh and tool changes
gcode:
    {% set parsed = printer.ff_print %}
    {% set x = parsed.prime_tower_x|float if parsed.prime_tower_x is not none else params.X|float %}
    {% set y = parsed.prime_tower_y|float if parsed.prime_tower_y is not none else params.Y|float %}
    {% set width = parsed.prime_tower_width|float if parsed.prime_tower_width is not none else params.WIDTH|float %}
    {% set depth = parsed.prime_tower_depth|float if parsed.prime_tower_depth is not none else params.DEPTH|default(width)|float %}
    {% set brim = parsed.prime_tower_brim|float if parsed.prime_tower_brim is not none else params.BRIM|default(0)|float %}
    {% set rot = parsed.prime_tower_rotation|float if parsed.prime_tower_rotation is not none else params.ROT|default(0)|float %}

    {% if parsed.prime_tower_x is not none and
          ((params.X|float - x)|abs > 0.001 or
           (params.Y|float - y)|abs > 0.001) %}
        { action_respond_info(
            "Prime Tower: replacing Orca start placeholder %.3f,%.3f with active-plate value %.3f,%.3f"
            % (params.X|float, params.Y|float, x, y)
        ) }
    {% endif %}

    {% set safety = 1.0 %}

    {% set cx = parsed.prime_tower_center_x|float if parsed.prime_tower_center_x is not none else x + width / 2.0 %}
    {% set cy = parsed.prime_tower_center_y|float if parsed.prime_tower_center_y is not none else y + depth / 2.0 %}

    {% set hx = width / 2.0 + brim + safety %}
    {% set hy = depth / 2.0 + brim + safety %}

    {% if parsed.prime_tower_core_min_x is not none %}
        {% set xmin = parsed.prime_tower_core_min_x|float - brim - safety %}
        {% set xmax = parsed.prime_tower_core_max_x|float + brim + safety %}
        {% set ymin = parsed.prime_tower_core_min_y|float - brim - safety %}
        {% set ymax = parsed.prime_tower_core_max_y|float + brim + safety %}
    {% else %}
        {% set r = 1.414214 * ([hx, hy]|max) %}
        {% set xmin = cx - r %}
        {% set xmax = cx + r %}
        {% set ymin = cy - r %}
        {% set ymax = cy + r %}
    {% endif %}

    { action_respond_info(
        "Prime Tower: center %.3f,%.3f nominal %.3fx%.3f brim %.3f rotation %.1f"
        % (cx, cy, width, depth, brim, rot)
    ) }

    { action_respond_info(
        "Prime Tower rotation-safe bounds: X %.3f..%.3f Y %.3f..%.3f"
        % (xmin, xmax, ymin, ymax)
    ) }

    TOOLCHANGE_SET_PRIME_TOWER CENTER_X={cx} CENTER_Y={cy} WIDTH={width} DEPTH={depth} BRIM={brim} ROT={rot} SAFETY={safety}
    EXCLUDE_OBJECT_DEFINE NAME=PRIME_TOWER CENTER={cx},{cy} POLYGON=[[{xmin},{ymin}],[{xmax},{ymin}],[{xmax},{ymax}],[{xmin},{ymax}],[{xmin},{ymin}]]


#####################################################################
# Purge line near current print objects
#####################################################################

[gcode_macro PURGE_NEAR_OBJECT]
description: Print the purge line close to the current print objects
gcode:
    {% set bed_min_x = -1.0 %}
    {% set bed_max_x = 257.0 %}
    {% set bed_min_y = -1.0 %}
    {% set bed_max_y = 257.0 %}

    {% set gap = params.GAP|default(12)|float %}
    {% set margin = params.MARGIN|default(16)|float %}
    {% set z = params.Z|default(0.2)|float %}
    {% set e = params.E|default(25)|float %}
    {% set feed = params.F|default(600)|float %}

    {% set objects = printer.exclude_object.objects %}

    {% if objects|length == 0 %}
        { action_raise_error(
            "PURGE_NEAR_OBJECT: no EXCLUDE_OBJECT definitions available"
        ) }
    {% endif %}

    {% set ns = namespace(
        xmin=9999.0,
        xmax=-9999.0,
        ymin=9999.0,
        ymax=-9999.0
    ) %}

    {% for object in objects %}
        {% for p in object.polygon %}
            {% set px = p[0]|float %}
            {% set py_obj = p[1]|float %}

            {% if px < ns.xmin %}
                {% set ns.xmin = px %}
            {% endif %}

            {% if px > ns.xmax %}
                {% set ns.xmax = px %}
            {% endif %}

            {% if py_obj < ns.ymin %}
                {% set ns.ymin = py_obj %}
            {% endif %}

            {% if py_obj > ns.ymax %}
                {% set ns.ymax = py_obj %}
            {% endif %}
        {% endfor %}
    {% endfor %}

    {% set cx = (ns.xmin + ns.xmax) / 2.0 %}

    {% set x1 = [cx - 25.0, ns.xmin - margin + 1.0, bed_min_x]|max %}
    {% set x2 = [cx + 25.0, ns.xmax + margin - 1.0, bed_max_x]|min %}

    {% if ns.ymin - gap >= bed_min_y %}
        {% set py = ns.ymin - gap %}
    {% else %}
        {% set py = ns.ymax + gap %}
    {% endif %}

    {% set py = [[py, bed_min_y]|max, bed_max_y]|min %}

    {% if x2 - x1 < 20.0 %}
        { action_raise_error(
            "PURGE_NEAR_OBJECT: not enough safe X distance for purge line"
        ) }
    {% endif %}

    { action_respond_info(
        "Purge line: X %.1f..%.1f Y %.1f; object bounds X %.1f..%.1f Y %.1f..%.1f"
        % (x1, x2, py, ns.xmin, ns.xmax, ns.ymin, ns.ymax)
    ) }

    G90
    M83

    G1 Z5 F2400
    G1 X{x1} Y{py} F6000
    G1 Z{z} F1200

    G1 E8 F{feed}
    G1 X{x2} E{e - 8.0} F{feed}
