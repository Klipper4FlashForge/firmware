# By using these files I affirm my respect for Ukraine's sovereignty and
# territorial integrity and my support for UN GA resolution ES-11/1.

# ---------------------------------------------------------------------------
# DO NOT EDIT THIS FILE. Every update overwrites it. Put your changes in
# printer.cfg instead: no flash ever writes that file. Klipper parses with
# RawConfigParser(strict=False), so same-named sections MERGE and the LAST
# value wins -- restate only what you are changing, at the END of printer.cfg.
# ---------------------------------------------------------------------------
# ff-runout.cfg -- filament runout / clog handling for Mainsail prints.
#
# The stock config ships all eight sensors with pause_on_runout: False and a
# runout_gcode that only prints "wheel runout:Tn" -- the touchscreen app did
# the rest, polling the MOUNTED channel's switch sensor from its print engine
# and keeping only the mounted tool's motion sensor enabled. See
# docs/notes/49-runout-recovered.md.
#
# Two owners since AFC (ff-afc.cfg). The presence switches (fd_ex*) are
# AFC's: it reads their pins through sensors of its own and, when the mounted
# head runs dry, swaps to the backup head SET_RUNOUT named (infinite spool) or
# pauses. This file keeps the motion sensors (fm_ex*): ff_toolchange.py arms
# the mounted tool's on every grab and disarms everything on release, and
# their runout_gcode pauses ONLY when an SD print is running and the sensor
# belongs to the mounted tool. Clear the clog, then RESUME.
#
# INSTALL: nothing to do -- printer.base.cfg ships the include. It lands AFTER
# the stock printer.filament.cfg, which is what makes this file work, so it
# only has to restate the options it changes. Do not edit
# printer.filament.cfg; the OTA overwrites it.
# ---------------------------------------------------------------------------

# insert_gcode is empty on purpose: FlashForge's prints "wheel insert:Tn"
# whenever an idle head moves filament, a load included.
[filament_motion_sensor fm_ex0]
pause_on_runout: False
runout_gcode:
    _FF_RUNOUT TOOL=0
insert_gcode:

[filament_motion_sensor fm_ex1]
pause_on_runout: False
# Stock binds all four motion sensors to `extruder` (extruder0), so a clog on
# T1..T3 was measured against T0's movement. Each sensor watches its own tool.
extruder: extruder1
runout_gcode:
    _FF_RUNOUT TOOL=1
insert_gcode:

[filament_motion_sensor fm_ex2]
pause_on_runout: False
extruder: extruder2
runout_gcode:
    _FF_RUNOUT TOOL=2
insert_gcode:

[filament_motion_sensor fm_ex3]
pause_on_runout: False
extruder: extruder3
runout_gcode:
    _FF_RUNOUT TOOL=3
insert_gcode:

# Policy knob, and nothing else -- no macro writes to it. clog_pause is the
# app's general.json "plugCheck" toggle: the motion sensors stay armed, and a
# clog is reported, not acted on, when 0. It pauses the moment the sensor
# trips, as the app did.
[gcode_macro _FF_RUNOUT_CFG]
variable_clog_pause: 1
gcode:

# Called by the motion sensors' runout_gcode. Klipper already filters on the
# idle_timeout "Printing" state (any motion counts, a LOAD_FILAMENT too), so
# the SD-job check here is what keeps a manual unload from pausing nothing.
[gcode_macro _FF_RUNOUT]
gcode:
    {% set tool = params.TOOL|int %}
    {% set cfg = printer["gcode_macro _FF_RUNOUT_CFG"] %}
    {% set tc = printer.ff_toolchange %}
    {% set sensor = 'fm_ex%d' % tool %}
    {% if printer.print_stats.state != 'printing' or printer.pause_resume.is_paused %}
        { action_respond_info("%s: clog event on T%d ignored (no print running)" % (sensor, tool)) }
    {% elif tool != tc.current_tool %}
        { action_respond_info("%s: clog event on T%d ignored (mounted tool is T%d)" % (sensor, tool, tc.current_tool)) }
    {% elif not cfg.clog_pause %}
        { action_respond_info("%s: clog detected on T%d -- not pausing (clog_pause=0)" % (sensor, tool)) }
    {% else %}
        PAUSE
        M117 T{tool} clog
        { action_respond_info("Paused: clog detected on T%d. Clear it, then RESUME (or CANCEL_PRINT)." % tool) }
    {% endif %}
