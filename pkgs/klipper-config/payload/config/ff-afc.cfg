# territorial integrity and my support for UN GA resolution ES-11/1.

# ---------------------------------------------------------------------------
# DO NOT EDIT THIS FILE. Every update overwrites it. Put your changes in
# printer.cfg instead: no flash ever writes that file. Klipper parses with
# RawConfigParser(strict=False), so same-named sections MERGE and the LAST
# value wins -- restate only what you are changing, at the END of printer.cfg.
# ---------------------------------------------------------------------------
# ff-afc.cfg -- AFC (AFC-Klipper-Add-On, package anvil-afc) over the Creator 5
# toolchanger.
#
# AFC is a filament layer, not a toolchanger. ff_toolchange.py still docks,
# grabs and offsets the heads; AFC sits on top as one "Toolchanger" unit with
# a standalone lane per head, e0..e3, and owns:
#   * T0..T3 -- which head a slicer's T<n> lands on. SET_MAP LANE=e2 MAP=T0
#     prints the file's T0 with the third head. RESET_AFC_MAPPING puts every
#     lane back on the map below and clears the backups (RUNOUT=no keeps
#     them). M104/M109 T<n> follow the same map. SELECT_TOOL T=<n> grabs a
#     head by its physical number, bypassing the map.
#   * Infinite spool -- SET_RUNOUT LANE=e0 RUNOUT=e1: when e0's gate sensor
#     runs dry mid-print, AFC swaps to e1, moves e0's T-number onto it and
#     resumes. With no backup set it pauses, as before.
#   * Spoolman -- SET_SPOOL_ID LANE=e0 SPOOL_ID=<id> per head; AFC makes that
#     spool Moonraker's active one whenever its head is selected, so usage is
#     charged to the right spool.
#   * lane_data in Moonraker's database, which OrcaSlicer's device tab reads.
# Mainsail's AFC panel and HelixScreen's AFC backend drive all of it.
#
# The heads' presence switches (fd_ex0..3, FlashForge's printer.filament.cfg)
# are shared with AFC: pin_tool_start names the same pin, and AFC declares it
# multi-use. Their runout belongs to AFC now; ff-runout.cfg keeps the motion
# (clog) sensors.
#
# AFC's writable state lives in AFC/ beside this file -- AFC.var.unit (maps,
# spools, runout lanes, which lane each head holds) and AFC_auto_vars.cfg
# (values AFC saves for itself). anvil-link-prog.sh creates the directory; no
# package owns it, so an update never resets a map or a spool.
# ---------------------------------------------------------------------------

[AFC]
VarFile: /usr/data/anvil-data/config/AFC/AFC.var
# A head is loaded by LOAD_FILAMENT at the purge chute (_FF_AFC_LOAD below),
# never by AFC pushing filament through a hotend on its own.
enable_standalone_purge: False
# The temperature AFC heats a head to before a load or unload when its lane
# has none of its own: ff-filament.cfg's `temps` table (the app's), restated
# because AFC reads only this. AFC matches a lane's material by SUBSTRING, in
# this order, so every name comes before any name it contains (PLA-CF before
# PLA, PC-ABS before PC and ABS). qa/static holds the two tables equal.
default_material_temps: default: 220, PLA-CF: 220, PETG-CF: 240, PET-CF: 270,
    PAHT-CF: 280, S-PAHT: 280, S-MULTI: 270, PA-CF: 270, PPS-CF: 290,
    PC-ABS: 260, TPU-90A: 220, TPU-95A: 220, TPU-64D: 220, SILK: 220,
    HIPS: 250, PVA: 220, PETG: 240, PLA: 220, ABS: 250, ASA: 250, PC: 260,
    PA: 260, CUSTOM: 220
# Everything else stays at AFC's defaults, which already fit a toolchanger
# with its own dock, purge chute and nozzle wipe: park, poop, kick, wipe,
# tool_cut and form_tip are off, z_hop is 0 (ff_toolchange owns the moves),
# and no LEDs are driven.

# AFC writes statistics and slot data to Moonraker with blocking HTTP
# requests from klippy's main loop, some of them straight after a toolchange
# while the moves back to the print are still queued -- long enough, on this
# CPU, for "Timer too close". ff_afc.py hands those writes to a background
# thread. Reads are left alone.
[ff_afc]

[AFC_prep]
enable: True
# UNLOAD_FILAMENT stays ours: custom_unload_cmd below calls it, and AFC's
# default remap of that name to its own TOOL_UNLOAD would call itself.
disable_unload_filament_remapping: True

# PREP is what loads AFC.var.unit, takes over T0..T3, M104/M109, PAUSE and
# RESUME, and reports the lanes. AFC runs nothing by itself at startup.
[delayed_gcode _FF_AFC_PREP]
initial_duration: 2
gcode:
    PREP

[AFC_Toolchanger Tools]

# One section per head, and the name is a contract: lane e<n> is head n, the
# head whose extruder is extruder<n> (plain `extruder` for head 0). The macros
# find a head's lane by that name (START_PRINT, LOAD_FILAMENT, the nozzle
# clean), and qa/static holds these sections to it. It is also the lane name
# the UIs show.
#   extruder_name          the head's Klipper extruder. AFC selects a head
#                          with SELECT_TOOL T=<n>, n taken from this name
#   u1_park_detector_name  whether the head is on the carriage: ff_toolchange
#                          registers `park_detector T<n>` from its dock and
#                          grab sensors. Without it AFC treats every head as
#                          mounted and a T<n> after a park grabs nothing
#   pin_tool_start         the fd_ex<n> presence switch, same pin and polarity
#                          as FlashForge's section
#   map                    the T-number the head answers to until SET_MAP
#                          moves it (AFC.var.unit remembers the move)
[AFC_extruder e0]
extruder_name: extruder
toolchanger_unit: Tools
u1_park_detector_name: T0
pin_tool_start: !eheaterboard:PC13
map: T0
custom_load_cmd: _FF_AFC_LOAD TOOL=0
custom_unload_cmd: UNLOAD_FILAMENT TOOL=0 RELEASE=0 HEAT_OFF=0

[AFC_extruder e1]
extruder_name: extruder1
toolchanger_unit: Tools
u1_park_detector_name: T1
pin_tool_start: !eheaterboard:PC14
map: T1
custom_load_cmd: _FF_AFC_LOAD TOOL=1
custom_unload_cmd: UNLOAD_FILAMENT TOOL=1 RELEASE=0 HEAT_OFF=0

[AFC_extruder e2]
extruder_name: extruder2
toolchanger_unit: Tools
u1_park_detector_name: T2
pin_tool_start: !eheaterboard:PC3
map: T2
custom_load_cmd: _FF_AFC_LOAD TOOL=2
custom_unload_cmd: UNLOAD_FILAMENT TOOL=2 RELEASE=0 HEAT_OFF=0

[AFC_extruder e3]
extruder_name: extruder3
toolchanger_unit: Tools
u1_park_detector_name: T3
pin_tool_start: !eheaterboard:PA2
map: T3
custom_load_cmd: _FF_AFC_LOAD TOOL=3
custom_unload_cmd: UNLOAD_FILAMENT TOOL=3 RELEASE=0 HEAT_OFF=0

# AFC's load step for a head, run when AFC selects a lane it does not yet
# hold as loaded in that head, and by the Load button in the UIs.
#
# During a job it does nothing. The only thing that could feed a Creator 5
# head is LOAD_FILAMENT, which refuses to run mid-print -- and filament that
# reached the gate switch is already the head's. AFC checks that switch as
# soon as this returns, so a head with no filament still stops the job, with
# AFC's message. That covers a running print and AFC's own infinite-runout
# swap, which runs with the job paused but pause_resume not yet in PAUSE.
#
# Otherwise it is LOAD_FILAMENT: idle, or paused by PAUSE, where
# LOAD_FILAMENT loads the mounted head only. The head stays on the carriage
# and hot, because AFC selected it and restores the temperature itself.
[gcode_macro _FF_AFC_LOAD]
description: AFC load step for one Creator 5 head (custom_load_cmd)
gcode:
    {% set tool = params.TOOL|int %}
    {% set job = printer.print_stats.state in ('printing', 'paused') %}
    {% if job and not printer.pause_resume.is_paused %}
        { action_respond_info("T%d head: filament at the gate is taken as loaded (no feed during a job)" % tool) }
    {% else %}
        LOAD_FILAMENT TOOL={tool} RELEASE=0 HEAT_OFF=0
    {% endif %}

# What AFC saves for itself (AFC_auto_vars.cfg) and anything you put in AFC/
# as .cfg. After the sections above, so a saved value wins over the shipped
# one. A pattern that matches nothing is not an error.
[include AFC/*.cfg]
