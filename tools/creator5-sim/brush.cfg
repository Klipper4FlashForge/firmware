# Brush sequence with a staged return to the saved print position.
[gcode_macro AFC_BRUSH]
description: Brush nozzle against rubber
variable_travel_speed: 200
variable_shortcuts: 1
gcode:
    {% set saved = printer.gcode_move.gcode_position %}
    {% set x_frame = printer.toolhead.position.x - saved.x %}
    {% set safe_x = 245 - x_frame %}
    {% set travel = printer['gcode_macro AFC_BRUSH'].travel_speed|float * 60 %}
    {% set shortcuts = printer['gcode_macro AFC_BRUSH'].shortcuts|int %}
    SAVE_GCODE_STATE NAME=_afc_brush

    G90

    # Lift by 5 mm, with a minimum clearance of Z5 for unusual starts.
    G1 Z{[saved.z + 5, 5]|max} F1500

    # Never move Y while X is in the obstacle zone.
    # If already at or below X245, no X move is needed.
    {% if printer.toolhead.position.x > 245 %}
        G1 X{safe_x} F6000
        G1 Y7 F{travel}
    {% elif shortcuts %}
        # This whole diagonal lies inside the clear machine-X half-plane.
        G1 X{safe_x} Y7 F{travel}
    {% else %}
        G1 Y7 F{travel}
    {% endif %}

    # Cross into the rubber area only after the Y approach has finished.
    G1 X265 F6000

    # Lower onto rubber
    G1 Z-0.5 F1500

    # Two wipe passes
    G1 X271 F6000
    G1 X264 F6000
    G1 X271 F6000
    G1 X264 F6000

    # Leave rubber vertically before any XY movement
    G1 Z0 F1500
    G1 Z1 F1500
    G1 Z3 F1500
    G1 Z5 F1500

    G1 X{safe_x} F6000

    _AFC_BRUSH_RETURN X={saved.x} Y={saved.y} Z={saved.z} TRAVEL={travel} SHORTCUTS={shortcuts}

    RESTORE_GCODE_STATE NAME=_afc_brush

[gcode_macro _AFC_BRUSH_RETURN]
description: Return from rubber at clearance height, then lower vertically
gcode:
    {% set x = params.X|float %}
    {% set y = params.Y|float %}
    {% set z = params.Z|float %}
    {% set clearance = [z + 5, 5, printer.gcode_move.gcode_position.z]|max %}
    {% set x_frame = printer.toolhead.position.x - printer.gcode_move.gcode_position.x %}
    {% set travel = params.TRAVEL|float %}
    G90
    G1 Z{clearance} F1500
    M400
    # Keep machine X at the clearance boundary while changing Y.
    {% if params.SHORTCUTS|int and x + x_frame <= 245 %}
        G1 X{x} Y{y} F{travel}
    {% else %}
        G1 Y{y} F{travel}
        G1 X{x} F6000
    {% endif %}
    M400
    G1 Z{z} F1500
    M400
